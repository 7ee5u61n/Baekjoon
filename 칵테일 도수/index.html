<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칵테일 도수 계산기</title>
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator-container">
    <div class="header">
        <h1>칵테일 도수 계산기</h1>
        <p>재료의 용량과 도수를 입력하면 최종 알코올 수치를 계산합니다.</p>
    </div>
    
    <div class="content">
        <div class="ingredient-list" id="ingredientList">
            <!-- JavaScript로 행이 추가되는 영역 -->
        </div>

        <button class="btn-add" id="btnAdd">+ 재료 추가하기</button>

        <div class="results">
            <div class="result-item">
                <span>총 용량</span>
                <span class="result-value"><span id="resVolume">0</span> ml</span>
            </div>
            <div class="result-item">
                <span>순수 알코올 량</span>
                <span class="result-value"><span id="resMass">0</span> g</span>
            </div>
            <div class="result-item highlight">
                <span>예상 최종 도수</span>
                <span class="result-value"><span id="resAbv">0.0</span> %</span>
            </div>
        </div>
    </div>
</div>

<!-- 외부 JS 파일 연결 -->
<script src="script.js"></script>
</body>
</html>
