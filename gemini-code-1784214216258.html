<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칵테일 도수 계산기</title>
    <style>
        :root {
            --bg-color: #f7f4f0;
            --card-bg: #ffffff;
            --text-main: #3e2723;
            --text-muted: #795548;
            --accent: #d35400;
            --border: #d7ccc8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .calculator-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(62, 39, 35, 0.08);
            overflow: hidden;
        }

        .header {
            background-color: var(--text-main);
            color: #fff;
            padding: 1.5rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 0.875rem;
            opacity: 0.8;
        }

        .content {
            padding: 1.5rem;
        }

        .ingredient-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .ingredient-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background-color: #faf9f8;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.875rem;
            background-color: #fff;
            color: var(--text-main);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #d32f2f;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.5rem;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }

        .btn-delete:hover {
            opacity: 0.7;
        }

        .btn-add {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px dashed var(--text-muted);
            color: var(--text-main);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: #efebe6;
        }

        .results {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .result-item.highlight {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 1rem;
        }

        .result-value {
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="header">
        <h1>칵테일 도수 계산기</h1>
        <p>재료의 용량과 도수를 입력하면 최종 알코올 수치를 계산합니다.</p>
    </div>
    
    <div class="content">
        <div class="ingredient-list" id="ingredientList">
            <!-- JavaScript로 행이 추가되는 영역 -->
        </div>

        <button class="btn-add" onclick="addIngredient('', '', '')">+ 재료 추가하기</button>

        <div class="results">
            <div class="result-item">
                <span>총 용량</span>
                <span class="result-value"><span id="resVolume">0</span> ml</span>
            </div>
            <div class="result-item">
                <span>순수 알코올 량</span>
                <span class="result-value"><span id="resMass">0</span> g</span>
            </div>
            <div class="result-item highlight">
                <span>예상 최종 도수</span>
                <span class="result-value"><span id="resAbv">0.0</span> %</span>
            </div>
        </div>
    </div>
</div>

<script>
    const ingredientList = document.getElementById('ingredientList');
    const resVolume = document.getElementById('resVolume');
    const resAbv = document.getElementById('resAbv');
    const resMass = document.getElementById('resMass');

    // 초기 예시 데이터 셋업
    const initialData = [
        { name: '필스너 우르켈', vol: 330, abv: 4.4 },
        { name: '위스키', vol: 30, abv: 40 }
    ];

    function init() {
        initialData.forEach(item => addIngredient(item.name, item.vol, item.abv));
        calculate();
    }

    // 재료 입력 행 추가
    function addIngredient(nameValue = '', volValue = '', abvValue = '') {
        const row = document.createElement('div');
        row.className = 'ingredient-row';
        
        row.innerHTML = `
            <div class="input-group" style="flex: 1.5;">
                <label>재료명</label>
                <input type="text" placeholder="예: 진, 토닉워터" class="inp-name" value="${nameValue}" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>용량 (ml)</label>
                <input type="number" min="0" placeholder="0" class="inp-vol" value="${volValue}" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>도수 (%)</label>
                <input type="number" min="0" max="100" step="0.1" placeholder="0" class="inp-abv" value="${abvValue}" oninput="calculate()">
            </div>
            <button class="btn-delete" onclick="removeIngredient(this)" title="삭제">×</button>
        `;
        
        ingredientList.appendChild(row);
        calculate();
    }

    // 재료 입력 행 삭제
    function removeIngredient(btn) {
        btn.parentElement.remove();
        calculate();
    }

    // 도수 및 알코올 계산 로직 (파이썬 코드 기반)
    function calculate() {
        const rows = document.querySelectorAll('.ingredient-row');
        
        let numerator = 0;
        let denominator = 0; // 총 용량

        rows.forEach(row => {
            const vol = parseFloat(row.querySelector('.inp-vol').value) || 0;
            const abv = parseFloat(row.querySelector('.inp-abv').value) || 0;
            
            numerator += (vol * abv);
            denominator += vol;
        });

        // 결과 계산 및 소수점 첫째 자리 반올림
        let finalAbv = 0;
        let alcoholMass = 0;

        if (denominator > 0) {
            finalAbv = (numerator / denominator).toFixed(1);
            // 알코올 질량(g) = 총 용량 * (도수*0.01) * 에탄올 비중(0.785)
            alcoholMass = (finalAbv * 0.01 * denominator * 0.785).toFixed(1);
        }

        // 화면 업데이트
        resVolume.textContent = denominator;
        resAbv.textContent = finalAbv;
        resMass.textContent = alcoholMass;
    }

    // 페이지 로드 시 초기화 실행
    window.onload = init;
</script>

</body>
</html>
